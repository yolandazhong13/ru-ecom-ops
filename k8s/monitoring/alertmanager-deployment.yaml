apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ru-ecom-ops
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: '${SLACK_WEBHOOK_URL}'

    # Templates
    templates:
      - '/etc/alertmanager/templates/slack.tmpl'

    # Routes for alert handling
    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      routes:
        # Critical alerts - immediate Slack notification + PagerDuty
        - match:
            severity: critical
          receiver: 'critical'
          group_wait: 0s
          repeat_interval: 1h

        # Warning alerts - batched Slack notification
        - match:
            severity: warning
          receiver: 'default'
          group_wait: 30s
          repeat_interval: 4h

        # Info alerts - once per day
        - match:
            severity: info
          receiver: 'info'
          repeat_interval: 24h

    # Receivers: how to send alerts
    receivers:
    - name: 'default'
      slack_configs:
      - channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

    - name: 'critical'
      slack_configs:
      - channel: '#critical-alerts'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'

      # Optional: PagerDuty integration for critical alerts
      # pagerduty_configs:
      # - routing_key: '${PAGERDUTY_ROUTING_KEY}'
      #   description: '{{ .GroupLabels.alertname }}'
      #   details:
      #     firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'

    - name: 'info'
      slack_configs:
      - channel: '#monitoring'
        title: 'Info: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'good'

    # Inhibit rules: suppress certain alerts
    inhibit_rules:
      # Don't alert on high error rate if circuit breaker is open (it's already open)
      - source_match:
          alertname: 'CircuitBreakerOpen'
        target_match:
          alertname: 'HighErrorRate'
        equal: ['severity']

      # Don't alert on pod crashing if deployment is completely down
      - source_match:
          alertname: 'ServiceDown'
        target_match:
          alertname: 'PodCrashing'
        equal: ['service']

  slack.tmpl: |
    {{ define "slack.default.title" -}}
    [{{ .Status | toUpper -}}
    {{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{- else }}:{{ .Alerts.Resolved | len }}{{- end }}
    ] {{ .CommonLabels.alertname }}
    {{- end }}

    {{ define "slack.default.text" -}}
    {{ range .Alerts -}}
    *Alert:* {{ .Labels.alertname }} - `{{ .Labels.severity }}`
    *Description:* {{ .Annotations.description }}
    *Details:*
      {{ range .Labels.SortedPairs -}}
      • *{{ .Name }}:* `{{ .Value }}`
      {{ end }}
      {{ range .Annotations.SortedPairs -}}
      • *{{ .Name }}:* `{{ .Value }}`
      {{ end }}
    {{ end }}
    {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ru-ecom-ops
  labels:
    app: alertmanager
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        prometheus.io/scrape: 'false'
    spec:
      serviceAccountName: alertmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534

      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.26.0
        imagePullPolicy: IfNotPresent
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
          - '--storage.path=/alertmanager'
          - '--log.level=info'

        ports:
        - name: web
          containerPort: 9093
          protocol: TCP

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /-/healthy
            port: web
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /-/ready
            port: web
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-storage
          mountPath: /alertmanager

        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: alertmanager-secrets
              key: slack-webhook-url

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
      - name: alertmanager-storage
        persistentVolumeClaim:
          claimName: alertmanager-storage

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - alertmanager
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ru-ecom-ops
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
  - name: web
    port: 9093
    targetPort: web
    protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-storage
  namespace: ru-ecom-ops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: ru-ecom-ops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alertmanager
  namespace: ru-ecom-ops
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alertmanager
  namespace: ru-ecom-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alertmanager
subjects:
- kind: ServiceAccount
  name: alertmanager
  namespace: ru-ecom-ops
