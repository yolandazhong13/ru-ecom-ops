    app: ru-ecom-ops
    component: registry
    environment: production
  annotations:
    description: "Container registry credentials for image pulls"
    version: "1.0.0"

type: kubernetes.io/dockercfg

# Note: This secret is used for pulling private container images
# Generate using:
#
# kubectl create secret docker-registry ru-ecom-ops-registry-credentials \
#   --docker-server=gcr.io \
#   --docker-username=_json_key \
#   --docker-password="$(cat ~/path/to/key.json)" \
#   -n ru-ecom-ops \
#   --dry-run=client -o yaml | kubectl apply -f -
