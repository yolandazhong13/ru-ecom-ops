---
# Example of how to manage secrets in production using external secrets operator
# This is a template for integrating with HashiCorp Vault or similar
apiVersion: v1
kind: ConfigMap
metadata:
  name: ru-ecom-ops-secrets-info
  namespace: ru-ecom-ops
  labels:
    app: ru-ecom-ops
    component: secrets-management
    environment: production
  annotations:
    description: "Information about secret management strategy"
    version: "1.0.0"

data:
  # Secret Management Guide
  secret-management.md: |
    # Secret Management Strategy

    ## For Development/Staging:
    1. Create secrets from command line:
       ```bash
       kubectl create secret generic ru-ecom-ops-secrets \
         --from-literal=slack-webhook-url='YOUR_SLACK_WEBHOOK' \
         --from-literal=smtp-server='smtp.gmail.com' \
         --from-literal=smtp-port='587' \
         --from-literal=smtp-user='YOUR_EMAIL' \
         --from-literal=smtp-password='YOUR_PASSWORD' \
         --from-literal=alert-email='YOUR_ALERT_EMAIL' \
         -n ru-ecom-ops
       ```

    ## For Production:
    1. Use HashiCorp Vault or AWS Secrets Manager
    2. Install External Secrets Operator (ESO):
       ```bash
       helm repo add external-secrets https://charts.external-secrets.io
       helm install external-secrets \
         external-secrets/external-secrets \
         -n external-secrets-system --create-namespace
       ```

    3. Create SecretStore pointing to your vault:
       ```yaml
       apiVersion: external-secrets.io/v1beta1
       kind: SecretStore
       metadata:
         name: vault-secretstore
         namespace: ru-ecom-ops
       spec:
         provider:
           vault:
             server: "https://vault.example.com:8200"
             path: "secret"
             auth:
               kubernetes:
                 mountPath: "kubernetes"
                 role: "ru-ecom-ops"
       ```

    4. Create ExternalSecret to sync:
       ```yaml
       apiVersion: external-secrets.io/v1beta1
       kind: ExternalSecret
       metadata:
         name: ru-ecom-ops-secrets
         namespace: ru-ecom-ops
       spec:
         refreshInterval: 1h
         secretStoreRef:
           name: vault-secretstore
           kind: SecretStore
         target:
           name: ru-ecom-ops-secrets
           creationPolicy: Owner
         data:
           - secretKey: slack-webhook-url
             remoteRef:
               key: ru-ecom-ops
               property: slack_webhook_url
           - secretKey: smtp-server
             remoteRef:
               key: ru-ecom-ops
               property: smtp_server
           # ... etc
       ```

    ## Best Practices:
    - Never commit secrets to git
    - Rotate secrets regularly
    - Use RBAC to restrict secret access
    - Audit secret access logs
    - Use encryption at rest for etcd
    - Implement pod security policies
    - Use network policies to restrict pod communication
