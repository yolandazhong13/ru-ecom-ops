apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ru-ecom-ops.labels" . | nindent 4 }}
    app: prometheus
spec:
  replicas: {{ .Values.prometheus.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "ru-ecom-ops.selectorLabels" . | nindent 6 }}
      app: prometheus
  template:
    metadata:
      labels:
        {{- include "ru-ecom-ops.selectorLabels" . | nindent 8 }}
        app: prometheus
      annotations:
        prometheus.io/scrape: 'false'
    spec:
      serviceAccountName: {{ include "ru-ecom-ops.fullname" . }}-prometheus
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.fsGroup }}

      containers:
      - name: prometheus
        image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
        imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time={{ .Values.prometheus.retention.time }}'
          - '--storage.tsdb.retention.size={{ .Values.prometheus.retention.size }}'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
          - '--web.enable-lifecycle'
          - '--log.level={{ .Values.logLevel }}'

        ports:
        - name: web
          containerPort: {{ .Values.prometheus.service.port }}
          protocol: TCP

        resources:
          {{- toYaml .Values.prometheus.resources | nindent 10 }}

        livenessProbe:
          httpGet:
            path: /-/healthy
            port: web
          initialDelaySeconds: {{ .Values.prometheus.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.prometheus.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.prometheus.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.prometheus.livenessProbe.failureThreshold }}

        readinessProbe:
          httpGet:
            path: /-/ready
            port: web
          initialDelaySeconds: {{ .Values.prometheus.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.prometheus.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.prometheus.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.prometheus.readinessProbe.failureThreshold }}

        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-recording-rules
          mountPath: /etc/prometheus/rules
        - name: prometheus-storage
          mountPath: /prometheus

        securityContext:
          {{- toYaml .Values.securityContext.containerSecurityContext | nindent 10 }}

      volumes:
      - name: prometheus-config
        configMap:
          name: {{ include "ru-ecom-ops.fullname" . }}-prometheus-config
      - name: prometheus-recording-rules
        configMap:
          name: {{ include "ru-ecom-ops.fullname" . }}-prometheus-recording-rules
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: {{ include "ru-ecom-ops.fullname" . }}-prometheus-storage

      {{- with .Values.prometheus.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ru-ecom-ops.labels" . | nindent 4 }}
    app: prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    {{- include "ru-ecom-ops.selectorLabels" . | nindent 4 }}
    app: prometheus
  ports:
  - name: web
    port: {{ .Values.prometheus.service.port }}
    targetPort: web
    protocol: TCP

---
{{- if .Values.prometheus.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus-storage
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ru-ecom-ops.labels" . | nindent 4 }}
    app: prometheus
spec:
  accessModes:
    - {{ .Values.prometheus.persistence.accessMode }}
  storageClassName: {{ .Values.prometheus.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
{{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ru-ecom-ops.labels" . | nindent 4 }}
    app: prometheus

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus
  labels:
    {{- include "ru-ecom-ops.labels" . | nindent 4 }}
    app: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus
  labels:
    {{- include "ru-ecom-ops.labels" . | nindent 4 }}
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus
subjects:
- kind: ServiceAccount
  name: {{ include "ru-ecom-ops.fullname" . }}-prometheus
  namespace: {{ .Values.namespace }}
