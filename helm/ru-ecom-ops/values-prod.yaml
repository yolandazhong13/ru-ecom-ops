# Production Environment Overrides
# Maximum resources, strict thresholds, high availability

global:
  environment: production

namespace: ru-ecom-ops

prometheus:
  replicaCount: 3
  image:
    repository: prom/prometheus
    tag: v2.45.0
    pullPolicy: IfNotPresent

  retention:
    time: 30d
    size: 50Gi

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  persistence:
    enabled: true
    storageClassName: standard
    accessMode: ReadWriteOnce
    size: 50Gi

  service:
    type: ClusterIP
    port: 9090

  scrapeInterval: 15s
  evaluationInterval: 15s

  externalLabels:
    cluster: production
    environment: prod

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - prometheus
          topologyKey: kubernetes.io/hostname

alertmanager:
  replicaCount: 3
  image:
    repository: prom/alertmanager
    tag: v0.26.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  persistence:
    enabled: true
    storageClassName: standard
    accessMode: ReadWriteOnce
    size: 10Gi

  service:
    type: ClusterIP
    port: 9093

  slack:
    enabled: true
    webhookUrlSecret: alertmanager-secrets
    webhookUrlKey: slack-webhook-url
    channels:
      default: '#alerts-prod'
      critical: '#alerts-critical-prod'
      info: '#monitoring-prod'

  pagerduty:
    enabled: true
    routingKeySecret: alertmanager-pagerduty
    routingKeyKey: pagerduty-routing-key

  routing:
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
    routes:
      - groupWait: 5s
        repeatInterval: 30m
      - groupWait: 30s
        repeatInterval: 1h
      - repeatInterval: 12h

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - alertmanager
          topologyKey: kubernetes.io/hostname

recordingRules:
  interval: 15s

alertRules:
  interval: 15s

  # Production: Strict thresholds
  podCrashing:
    enabled: true
    severity: critical

  highErrorRate:
    enabled: true
    threshold: 0.01  # 1% error rate
    duration: 2m
    severity: critical

  highRequestLatency:
    enabled: true
    threshold: 0.1  # 100ms
    duration: 2m
    severity: critical

  highMemoryUsage:
    enabled: true
    threshold: 0.85  # 85% of limit
    duration: 3m
    severity: critical

  cpuThrottling:
    enabled: true
    threshold: 0.1  # 10% throttling
    duration: 3m
    severity: warning

  persistentVolumeFull:
    enabled: true
    threshold: 0.75  # 75% full
    duration: 3m
    severity: critical

  databaseConnectionError:
    enabled: true
    duration: 2m
    severity: critical

  circuitBreakerOpen:
    enabled: true
    duration: 1m
    severity: critical

  serviceDown:
    enabled: true
    duration: 1m
    severity: critical

  deploymentReplicasMismatch:
    enabled: true
    duration: 2m
    severity: critical

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

logLevel: warn
