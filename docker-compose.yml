version: '3.9'

services:
  # Core application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ru-ecom-ops-app
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_PATH=/app/data/ecom.db
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - CIRCUIT_BREAKER_THRESHOLD=${CIRCUIT_BREAKER_THRESHOLD:-5}
      - CIRCUIT_BREAKER_TIMEOUT=${CIRCUIT_BREAKER_TIMEOUT:-60}
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ecom-data:/app/data
      - ecom-logs:/app/logs
      - ./scripts:/app/scripts
      - ./outputs:/app/outputs
    networks:
      - ecom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - db-backup
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database backup service
  db-backup:
    image: alpine:latest
    container_name: ru-ecom-ops-db-backup
    volumes:
      - ecom-data:/app/data
      - ecom-backups:/backups
    networks:
      - ecom-network
    entrypoint: |
      sh -c 'while true; do
        if [ -f /app/data/ecom.db ]; then
          cp /app/data/ecom.db /backups/ecom.db.$(date +%s).backup
          find /backups -name "ecom.db.*.backup" -mtime +7 -delete
        fi
        sleep 3600
      done'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-d", "/backups"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Monitoring service (optional)
  monitoring:
    image: prom/prometheus:latest
    container_name: ru-ecom-ops-monitoring
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - monitoring-data:/prometheus
    networks:
      - ecom-network
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  ecom-data:
    driver: local
  ecom-logs:
    driver: local
  ecom-backups:
    driver: local
  monitoring-data:
    driver: local

networks:
  ecom-network:
    driver: bridge
